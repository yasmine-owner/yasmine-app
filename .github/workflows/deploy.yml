
name: Extract Build and Deploy Factory ERP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Source Code
        shell: bash
        run: |
          PACKAGE=$(find extracted -type f -name package.json \
            -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found in ZIP"
            echo "Extracted files:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build React Application
        run: |
          cd "$PROJECT_DIR"
          REPO="${GITHUB_REPOSITORY#*/}"
          npm run build -- --base="/${REPO}/"

      - name: Verify Build
        run: |
          test -f "$PROJECT_DIR/dist/index.html"
          echo "Build completed successfully"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PROJECT_DIR }}/dist

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
