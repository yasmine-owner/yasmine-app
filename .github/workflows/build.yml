name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: فك المشروع
        run: |
          unzip -o yasmine_project*.zip
          cp -r yasmine_flutter/. .
          rm -rf yasmine_flutter yasmine_admin
          flutter create --org com.yasmine --project-name yasmine_app .
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts 2>/dev/null || sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: yasmine-apk
          path: build/app/outputs/flutter-apk/*.apk
