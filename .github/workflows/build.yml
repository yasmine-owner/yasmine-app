name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: فك المشروع
        run: |
          unzip -o yasmine_project*.zip
          cp -r yasmine_flutter/. .
          rm -rf yasmine_flutter yasmine_admin
          flutter create --org com.yasmine --project-name yasmine_app .
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter\.minSdkVersion/23/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter\.minSdkVersion/23/' android/app/build.gradle
          fi
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: yasmine-apk
          path: build/app/outputs/flutter-apk/*.apk
