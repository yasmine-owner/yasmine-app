<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>لوحة تحكم الياسمين — خاصة بالمالك</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--p:#0d1f3c;--a:#4da3ff;--bg:#f4f7fb;--brd:#dde5ef;--ok:#1da860;--warn:#e8930c;--bad:#e23d3d}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);color:#1a2333}
#app{max-width:820px;margin:0 auto;padding:14px}
.hd{background:linear-gradient(135deg,var(--p),#12294d);color:#fff;padding:14px 16px;border-radius:14px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd .lg{width:36px;height:36px;border-radius:10px;background:var(--a);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--p)}
.card{background:#fff;border:1px solid var(--brd);border-radius:14px;padding:14px;margin-bottom:12px}
.inp,select.inp{width:100%;border:1.5px solid var(--brd);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;background:#fff}
.btn{border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;background:var(--p);color:#fff;font-family:inherit}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gh{background:#fff;color:var(--p);border:1.5px solid var(--p)}
.btn.sm{padding:6px 10px;font-size:12px;width:auto}
.tag{border-radius:7px;padding:2px 8px;font-size:11px;font-weight:700}
.tok{background:#e4f7ec;color:var(--ok)}.twarn{background:#fdf1dc;color:#9a6305}.tbad{background:#fdeaea;color:var(--bad)}.tinfo{background:#e8f2ff;color:#2470c8}.tmut{background:#eef1f6;color:#6b7a90}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{border:1px solid var(--brd);border-radius:12px;padding:10px;text-align:center;background:#fff}
.stat b{display:block;font-size:18px}
.stat span{font-size:10.5px;color:#6b7a90}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex-shrink:0;border:1.5px solid var(--brd);background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:#6b7a90;font-family:inherit}
.tabs button.on{background:var(--p);border-color:var(--p);color:#fff}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.mut{color:#6b7a90;font-size:12px}
.item{border:1px solid var(--brd);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.item b{font-size:13.5px}
.colorrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.colorrow input[type=color]{width:52px;height:38px;border:1px solid var(--brd);border-radius:8px;padding:2px;background:#fff}
.sw{width:44px;height:24px;border-radius:12px;background:#cfd8e4;position:relative;cursor:pointer;flex-shrink:0}
.sw.on{background:var(--ok)}.sw::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.2s}
.sw.on::after{right:23px}
.swrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--brd)}
#toast{position:fixed;bottom:16px;right:50%;transform:translateX(50%);background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9;font-size:13px}
.center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ⚠️ المرحلة 3: استبدل ببيانات مشروع Firebase من console.firebase.google.com */
var firebaseConfig = {
  apiKey:"AIzaSyCYDerO1zy74-T2guNnsJy2GF0wZkVBoPQ",
  authDomain:"yasmine-app-8818b.firebaseapp.com",
  projectId:"yasmine-app-8818b",
  storageBucket:"yasmine-app-8818b.firebasestorage.app",
  messagingSenderId:"122644518096",
  appId:"1:122644518096:android:9724ee4272ab7152277ad5"
};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(),db=firebase.firestore();
var S={ref:db.collection('settings').doc('app'),tab:'dash',user:null,settings:null};
var STS={pending:['بانتظار تأكيدك','twarn'],success:['تم التأكيد ✓','tok'],failed:['فاشل','tbad'],refund_requested:['طلب استرداد — قرر','tbad'],refunded:['مسترد','tmut']};
var RST={awaiting_payment:['بانتظار دفع العميل','tbad'],awaiting_tech_payment:['إيداع الفني بانتظارك','twarn'],open:['منشور','tinfo'],chosen:['تم اختيار فني','twarn'],accepted:['الفني في الطريق','tok'],working:['جارٍ العمل','tinfo'],completed:['مكتمل','tok'],cancelled:['ملغى','tmut'],refunded:['مسترد','tmut']};
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2600)}
function log(msg){db.collection('logs').add({msg:msg,t:Date.now()})}

function render(){ if(!S.user) return loginView(); S.ref.get().then(function(d){S.settings=d.data()||{};view();}) }
function loginView(){
 document.getElementById('app').innerHTML=
 '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div style="width:100%;max-width:380px">'+
 '<div class="hd" style="justify-content:center"><div class="lg">🔐</div><b>لوحة تحكم الياسمين — خاصة بالمالك فقط</b></div>'+
 '<div class="card"><div class="mut" style="margin-bottom:6px">بريد المالك (يُنشأ من Firebase Console)</div><input class="inp" id="em" type="email" placeholder="owner@email.com" style="direction:ltr"/>'+
 '<div class="mut" style="margin:8px 0 6px">كلمة المرور</div><input class="inp" id="pw" type="password" style="direction:ltr"/>'+
 '<button class="btn" style="width:100%;margin-top:12px" onclick="doLogin()">دخول</button></div></div></div>';
}
function doLogin(){auth.signInWithEmailAndPassword(document.getElementById('em').value,document.getElementById('pw').value)
 .then(function(c){S.user=c.user; var pin=prompt('رمز PIN الخاص باللوحة (الافتراضي: 1234):');
   if(pin!==(S.settings&&S.settings.ownerPin||'1234')){alert('PIN غير صحيح');auth.signOut();return}
   render();}).catch(function(e){alert(e.message)})}

function view(){
 var tabs=[['dash','📊 الرئيسية'],['reqs','📋 الطلبات'],['techs','🔧 الفنيون'],['pays','💳 المدفوعات'],['theme','🎨 المظهر والفورم'],['fees','💲 الرسوم'],['accs','🏦 حسابات الدفع'],['comp','⚠️ الشكاوى'],['more','⚙️ الإعدادات']];
 var body=S.tab==='dash'?vDash():S.tab==='reqs'?vReqs():S.tab==='techs'?vTechs():S.tab==='pays'?vPays():S.tab==='theme'?vTheme():S.tab==='fees'?vFees():S.tab==='accs'?vAccs():S.tab==='comp'?vComp():vMore();
 document.getElementById('app').innerHTML=
 '<div class="hd"><div class="lg">ي</div><div style="flex:1"><b>لوحة تحكم الياسمين</b><div class="mut" style="color:#9db4d8;font-size:11px">خاصة بالمالك — '+S.user.email+'</div></div><button class="btn gh sm" onclick="auth.signOut();location.reload()">خروج</button></div>'+
 '<div class="tabs">'+tabs.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" onclick="S.tab=\''+t[0]+'\';view()">'+t[1]+'</button>'}).join('')+'</div>'+html;
 });}

function vDash(){
 return new Promise(function(res){ db.collection('requests').get().then(function(rq){ db.collection('payments').get().then(function(pp){
  var R=rq.docs.map(function(d){return d.data()}),P=pp.docs.map(function(d){return d.data()});
  var g=function(s){return R.filter(function(r){return r.status===s}).length};
  var okP=P.filter(function(p){return p.status==='success'});
  var html='<div class="grid">'+
  [['الطلبات النشطة',g('open')+g('chosen')+g('accepted')+g('working')],['مكتملة',g('completed')],['ملغاة',g('cancelled')+g('refunded')],
   ['محصّل (ج.م)',okP.reduce(function(a,p){return a+p.amount},0)],['بانتظار تأكيد دفع',P.filter(function(p){return p.status==='pending'}).length],
   ['طلبات استرداد',P.filter(function(p){return p.status==='refund_requested'}).length]].map(function(s){return '<div class="stat"><b>'+s[1]+'</b><span>'+s[0]+'</span></div>'}).join('')+'</div>';
  res(html);});});});
}

function vReqs(){return listHTML('requests',function(r,id){
 var s=RST[r.status]||['—','tmut'];
 return '<div class="item"><div class="row"><div><b>'+(r.serviceId||'')+'</b><div class="mut">'+(r.customerName||'')+' • '+(r.customerPhone||'')+'</div><div class="mut">'+(r.car||'')+' • '+(r.loc||'')+' • "'+(r.desc||'')+'"</div></div><span class="tag '+s[1]+'">'+s[0]+'</span></div>'+
 (['open','chosen'].indexOf(r.status)>-1?'<button class="btn bad sm" style="margin-top:6px" onclick="db.collection(\'requests\').doc(\''+id+'\').update({status:\'cancelled\'});log(\'إلغاء إداري للطلب '+id+'\')">إلغاء إداري</button>':'')+'</div>';})}
function vTechs(){
 return sect('بانتظار الاعتماد','technicians',function(t,id){return !t.approved&&t.pending;},function(t,id){
  return '<div class="item"><b>'+t.name+'</b><div class="mut">'+t.phone+' • '+t.area+'</div><div class="mut">'+(t.specs||[]).join('، ')+'</div>'+
  '<div class="row" style="margin-top:6px"><button class="btn ok sm" onclick="db.collection(\'technicians\').doc(\''+id+'\').update({approved:true,pending:false});log(\'اعتماد الفني \'+t.name)">✅ اعتماد</button>'+
  '<button class="btn bad sm" onclick="db.collection(\'technicians\').doc(\''+id+'\').update({rejected:true,pending:false})">❌ رفض</button></div></div>';})
 +sect('فنيون معتمدون','technicians',function(t){return t.approved;},function(t,id){
  return '<div class="item"><div class="row"><div><b>'+t.name+'</b><div class="mut">★ '+(t.rating||0)+' • '+(t.jobs||0)+' خدمة • '+t.area+'</div></div><span class="tag '+(t.blocked?'tbad':'tok')+'">'+(t.blocked?'موقوف':'نشط')+'</span></div>'+
  '<button class="btn gh sm" style="margin-top:6px" onclick="db.collection(\'technicians\').doc(\''+id+'\').update({blocked:'+!t.blocked+'})">'+(t.blocked?'إلغاء الإيقاف':'إيقاف الحساب')+'</button></div>';});}
function vPays(){
 return listHTML('payments',function(p,id){
  var s=STS[p.status]||['—','tmut'];
  return '<div class="item"><div class="row"><div><b>'+p.amount+' ج.م</b> <span class="tag '+(p.party==='customer'?'tinfo':'twarn')+'">'+(p.party==='customer'?'رسوم عميل':'إيداع فني')+'</span><div class="mut">'+p.tx+'</div>'+(p.receiptUrl?(p.receiptUrl.indexOf('data:image')===0?'<img src="'+p.receiptUrl+'" style="max-width:100%;border-radius:8px;margin-top:6px"/>':'<a href="'+p.receiptUrl+'" target="_blank">🧾 عرض الإيصال</a>'):'')+'</div><span class="tag '+s[1]+'">'+s[0]+'</span></div>'+
  (p.status==='pending'?'<div class="row" style="margin-top:6px"><button class="btn ok sm" onclick="confirmPay(\''+id+'\',\''+p.reqId+'\',\''+p.party+'\')">✅ تأكيد الاستلام</button><button class="btn gh sm" onclick="rejectPay(\''+id+'\',\''+p.reqId+'\')">الإيصال غير صحيح</button></div>':'')+
  (p.status==='success'?'<button class="btn gh sm" style="margin-top:6px" onclick="doRefund(\''+id+'\',\''+p.reqId+'\')">↩️ استرداد</button>':'')+
  (p.status==='refund_requested'?'<div class="row" style="margin-top:6px"><button class="btn ok sm" onclick="doRefund(\''+id+'\',\''+p.reqId+'\')">تنفيذ الاسترداد</button><button class="btn gh sm" onclick="db.collection(\'payments\').doc(\''+id+'\').update({status:\'success\'})">رفض الاسترداد</button></div>':'')+'</div>';});}
function confirmPay(pid,reqId,party){
 db.collection('payments').doc(pid).update({status:'success'}).then(function(){
  return db.collection('requests').doc(reqId).get();}).then(function(r){
   var st=r.data()&&r.data().status;
   if(party==='customer'&&st==='awaiting_payment') return db.collection('requests').doc(reqId).update({status:'open'});
   if(party==='tech'&&st==='awaiting_tech_payment') return db.collection('requests').doc(reqId).update({status:'accepted'});
  }).then(function(){toast('✅ تم التأكيد والخطوة الجاية اتفتحت');log('تأكيد عملية '+pid);view();});}
function rejectPay(pid,reqId){db.collection('payments').doc(pid).update({status:'failed'});db.collection('requests').doc(reqId).update({status:'cancelled'});log('رفض عملية '+pid);view();}
function doRefund(pid,reqId){
 var ref=db.collection('payments').doc(pid);
 ref.get().then(function(d){ if(d.data().status==='refunded'){toast('الاسترداد تم مسبقاً — لا يوجد استرداد مزدوج');return}
  ref.update({status:'refunded'}); db.collection('requests').doc(reqId).get().then(function(r){
   if(r.data()&&['awaiting_payment','open','chosen','cancelled'].indexOf(r.data().status)>-1)
    db.collection('requests').doc(reqId).update({status:'refunded'});});
  toast('↩️ تم تنفيذ الاسترداد');log('استرداد '+pid);view();});}

function vTheme(){
 var s=S.settings;
 function colorRow(k,label){return '<div class="colorrow"><input type="color" id="c-'+k+'" value="'+(s[k]?'#'+s[k].toString(16).padStart(6,'0'):'#0d1f3c')+'"/><b>'+label+'</b></div>'}
 function sw(k,label){return '<div class="swrow"><span>'+label+'</span><div class="sw '+(s.formConfig&&s.formConfig[k]!==false?'on':'')+'" onclick="toggleForm(\''+k+'\',this)"></div></div>'}
 return '<div class="card"><b>🎨 هوية التطبيق</b> <span class="tag tok">تنعكس فوراً على كل المستخدمين</span>'+
 '<div style="margin-top:8px"><div class="mut">اسم المنصة</div><input class="inp" id="t-name" value="'+(s.appName||'')+'"/></div>'+
 colorRow('primaryColor','اللون الأساسي (الكحلي)')+colorRow('accentColor','اللون الثانوي (السماوي)')+colorRow('emergencyColor','لون الطوارئ')+
 '<button class="btn ok" style="width:100%;margin-top:6px" onclick="saveTheme()">💾 حفظ وتطبيق فوري</button></div>'+
 '<div class="card"><b>📝 حقول فورم الطلب (منشئ الفورمز)</b>'+sw('photos','إرفاق صور')+sw('desc','وصف المشكلة')+sw('carYear','سنة الصنع')+sw('plate','رقم اللوحة')+sw('notes','ملاحظات إضافية')+
 '<div class="mut" style="margin-top:6px">الحقل الأساسي (السيارة/العطل/الموقع/الرسوم) ثابت حفاظاً على دورة الدفع.</div></div>'+
 '<div class="card"><b>🧰 الخدمات</b>'+Object.keys(s.services||{}).map(function(k){return '<div class="swrow"><span>'+k+'</span><div class="sw '+(s.services[k]?'on':'')+'" onclick="var sv=S.settings.services||{};sv[\''+k+'\']=!sv[\''+k+'\'];S.ref.update({services:sv});log((sv[\''+k+'\']?\'تفعيل\':\'إيقاف\')+\' خدمة: '+k+'\');view()"></div></div>'}).join('')+
 '<div class="row" style="margin-top:6px"><input class="inp" id="new-svc" placeholder="خدمة جديدة..."/><button class="btn gh sm" style="flex:0 0 auto" onclick="addSvc()">+ إضافة</button></div></div>';
}
function toggleForm(k,el){var f=S.settings.formConfig||{};f[k]=!(f[k]!==false);S.ref.update({formConfig:f});el.classList.toggle('on');toast('تم تحديث الفورم — يظهر في التطبيق فوراً');log('تعديل فورم: '+k)}
function saveTheme(){S.ref.update({appName:document.getElementById('t-name').value,
 primaryColor:parseInt(document.getElementById('c-primaryColor').value.slice(1),16),
 accentColor:parseInt(document.getElementById('c-accentColor').value.slice(1),16),
 emergencyColor:parseInt(document.getElementById('c-emergencyColor').value.slice(1),16)});
 toast('🎨 الهوية الجديدة حية الآن عند كل المستخدمين');log('تعديل الهوية والألوان');}
function addSvc(){var v=document.getElementById('new-svc').value.trim();if(!v)return;var sv=S.settings.services||{};sv[v]=true;S.ref.update({services:sv});log('إضافة خدمة: '+v);view();}

function vFees(){var s=S.settings;
 return '<div class="card"><b>💲 الرسوم</b> <span class="tag tok">فورية على التطبيق</span>'+
 '<div class="row" style="margin:10px 0"><div class="mut">رسوم العميل</div><input class="inp" id="f-c" type="number" value="'+(s.customerFee||30)+'" style="max-width:110px;text-align:center"/><div class="mut">ج.م</div></div>'+
 '<div class="row" style="margin:10px 0"><div class="mut">رسوم الفني</div><input class="inp" id="f-t" type="number" value="'+(s.techFee||25)+'" style="max-width:110px;text-align:center"/><div class="mut">ج.م</div></div>'+
 '<button class="btn ok" style="width:100%" onclick="S.ref.update({customerFee:+document.getElementById(\'f-c\').value,techFee:+document.getElementById(\'f-t\').value});toast(\'تم حفظ الرسوم وتطبيقها فوراً\');log(\'تعديل الرسوم\')">💾 حفظ</button></div>';}
function vAccs(){var s=S.settings; var acc=s.paymentAccounts||[];
 return '<div class="card"><b>🏦 حسابات استلام الفلوس</b> <span class="tag tinfo">تظهر للعميل والفني عند الدفع</span>'+
 acc.map(function(a,i){return '<div class="item"><div class="row"><div><b>'+a.type+'</b><div class="mut" style="direction:ltr;text-align:right">'+a.value+'</div></div><button class="btn bad sm" style="flex:0 0 auto" onclick="delAcc('+i+')">حذف</button></div></div>'}).join('')+
 '<div class="row" style="margin-top:6px"><select class="inp" id="na-t" style="max-width:130px"><option>انستاباي</option><option>فودافون كاش</option><option>اتصالات كاش</option><option>أورانج كاش</option><option>حساب بنكي IBAN</option></select><input class="inp" id="na-v" placeholder="الرقم أو الحساب" style="direction:ltr"/>'+
 '<button class="btn gh sm" style="flex:0 0 auto" onclick="addAcc()">+ إضافة</button></div></div>';}
function addAcc(){var v=document.getElementById('na-v').value.trim();if(!v)return;var acc=S.settings.paymentAccounts||[];acc.push({type:document.getElementById('na-t').value,value:v});S.ref.update({paymentAccounts:acc});log('إضافة حساب دفع');view();}
function delAcc(i){var acc=S.settings.paymentAccounts||[];if(acc.length<=1){toast('لازم يفضل حساب واحد على الأقل');return}acc.splice(i,1);S.ref.update({paymentAccounts:acc});view();}

function vComp(){return listHTML('complaints',function(c,id){
 return '<div class="item"><div class="row"><b>'+c.by+'</b><span class="tag '+(c.status==='open'?'tbad':'tok')+'">'+(c.status==='open'?'مفتوحة':'تمت المعالجة')+'</span></div><div class="mut">'+c.text+'</div>'+
 (c.status==='open'?'<div class="row" style="margin-top:6px"><button class="btn ok sm" onclick="db.collection(\'complaints\').doc(\''+id+'\').update({status:\'resolved\'})">معالجة بدون استرداد</button></div>':'')+'</div>';})}
var DEFAULT_SERVICES={'الكاوتش والإطارات':true,'البطاريات وكهرباء السيارات':true,'الميكانيكا والمحرك':true,'التبريد والسخونة':true,'الفرامل والعفشة والتوجيه':true,'تشخيص الكمبيوتر والحساسات':true,'تكييف السيارات':true,'الونش والسحب والإنقاذ':true,'قطع الغيار والمستلزمات':true,'خدمات المفاتيح':true,'السيارات الهجينة والكهربائية':true};
function seedPlatform(){ if(!confirm('زر التهيئة يكتب الإعدادات الافتراضية أول مرة فقط — متأكد؟'))return;
 S.ref.set({appName:'الياسمين لإصلاح أعطال السيارات في الطرق والصحراء',primaryColor:0x0d1f3c,accentColor:0x4da3ff,
 emergencyColor:0xe23d3d,logoUrl:'',ownerPhone:'',ownerPin:'1234',customerFee:30,techFee:25,
 paymentAccounts:[{type:'انستاباي',value:'غيّرني@instapay'},{type:'فودافون كاش',value:'01xxxxxxxxx'}],
 formConfig:{photos:true,desc:true,carYear:false,plate:false,notes:false},services:DEFAULT_SERVICES},{merge:true})

function sect(title,col,filter,renderItem){
 return new Promise(function(res){ db.collection(col).get().then(function(snap){
  var items=snap.docs.filter(function(d){return filter(d.data(),d.id)});
  res('<div class="mut" style="font-weight:700;margin-bottom:6px">'+title+' ('+items.length+')</div>'+(items.length?items.map(function(d){return renderItem(d.data(),d.id)}).join(''):'<div class="item center mut">لا يوجد</div>'));});});}
function listHTML(col,renderItem){
 return new Promise(function(res){ db.collection(col).orderBy('t','desc').limit(50).get().then(function(snap){
  res(snap.docs.map(function(d){return renderItem(d.data(),d.id)}).join('')||'<div class="item center mut">لا توجد بيانات</div>');});});}
