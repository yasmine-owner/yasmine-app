<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم الياسمين — خاصة بالمالك</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--p:#0d1f3c;--a:#4da3ff;--bg:#f4f7fb;--brd:#dde5ef;--ok:#1da860;--warn:#e8930c;--bad:#e23d3d}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Tahoma,sans-serif}
body{background:var(--bg);color:#1a2333}
#app{max-width:820px;margin:0 auto;padding:14px}
.hd{background:linear-gradient(135deg,var(--p),#12294d);color:#fff;padding:14px 16px;border-radius:14px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd .lg{width:36px;height:36px;border-radius:10px;background:var(--a);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--p);flex-shrink:0}
.card{background:#fff;border:1px solid var(--brd);border-radius:14px;padding:14px;margin-bottom:12px}
.inp,select.inp{width:100%;border:1.5px solid var(--brd);border-radius:10px;padding:10px;font-size:14px;background:#fff}
.btn{border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;background:var(--p);color:#fff}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gh{background:#fff;color:var(--p);border:1.5px solid var(--p)}
.btn.sm{padding:6px 10px;font-size:12px;width:auto}
.tag{border-radius:7px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.tok{background:#e4f7ec;color:var(--ok)}.twarn{background:#fdf1dc;color:#9a6305}.tbad{background:#fdeaea;color:var(--bad)}.tinfo{background:#e8f2ff;color:#2470c8}.tmut{background:#eef1f6;color:#6b7a90}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat{border:1px solid var(--brd);border-radius:12px;padding:10px;text-align:center;background:#fff}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#6b7a90}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex-shrink:0;border:1.5px solid var(--brd);background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:#6b7a90}
.tabs button.on{background:var(--p);border-color:var(--p);color:#fff}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0;flex:1}
.mut{color:#6b7a90;font-size:12px;overflow-wrap:anywhere}
.item{border:1px solid var(--brd);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.item b{font-size:13.5px}
.colorrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.colorrow input[type=color]{width:52px;height:38px;border:1px solid var(--brd);border-radius:8px;padding:2px;background:#fff}
.sw{width:44px;height:24px;border-radius:12px;background:#cfd8e4;position:relative;cursor:pointer;flex-shrink:0}
.sw.on{background:var(--ok)}
.sw:after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.2s}
.sw.on:after{right:23px}
.swrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--brd);gap:10px}
#toast{position:fixed;bottom:16px;right:50%;transform:translateX(50%);background:var(--p);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9;font-size:13px;max-width:90%;text-align:center}
.center{text-align:center}
.err{background:#fdeaea;color:#9c2020;padding:12px;border-radius:10px;margin-bottom:12px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="app"><div class="card center">جارٍ تحميل لوحة التحكم…</div></div>
<div id="toast" role="status"></div>
<script>
'use strict';

var firebaseConfig={
  apiKey:'AIzaSyCYDerO1zy74-T2guNnsJy2GF0wZkVBoPQ',
  authDomain:'yasmine-app-8818b.firebaseapp.com',
  projectId:'yasmine-app-8818b',
  storageBucket:'yasmine-app-8818b.firebasestorage.app',
  messagingSenderId:'122644518096',
  appId:'1:122644518096:android:9724ee4272ab7152277ad5'
};

var auth,db;
var S={ref:null,tab:'dash',user:null,settings:{}};

var STS={
  pending:['بانتظار تأكيدك','twarn'],
  success:['تم التأكيد ✓','tok'],
  failed:['فاشل','tbad'],
  refund_requested:['طلب استرداد — قرر','tbad'],
  refunded:['مسترد','tmut']
};

var RST={
  awaiting_payment:['بانتظار دفع العميل','tbad'],
  awaiting_tech_payment:['إيداع الفني بانتظارك','twarn'],
  open:['منشور','tinfo'],
  chosen:['تم اختيار فني','twarn'],
  accepted:['الفني في الطريق','tok'],
  working:['جارٍ العمل','tinfo'],
  completed:['مكتمل','tok'],
  cancelled:['ملغى','tmut'],
  refunded:['مسترد','tmut']
};

function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;
  t.style.display='block';
  clearTimeout(toast.timer);
  toast.timer=setTimeout(function(){t.style.display='none'},3000);
}

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  });
}

function log(msg){
  if(!db||!S.user)
    return db?Promise.resolve():Promise.reject(new Error('Firebase غير جاهز'));

  return db.collection('logs').add({
    msg:String(msg),t:Date.now(),uid:S.user.uid
  }).catch(function(e){
    console.error('تعذر تسجيل العملية',e);
  });
}

function showError(err){
  console.error(err);
  var msg=err&&err.message?err.message:String(err||'خطأ غير معروف');
  document.getElementById('app').insertAdjacentHTML(
    'afterbegin',
    '<div class="err"><b>تعذر تنفيذ العملية.</b><div>'+
    esc(msg)+'</div><div class="mut">راجع اتصال الإنترنت وصلاحيات Firebase Firestore للمستخدم المسجل.</div></div>'
  );
}

function withError(p){
  return Promise.resolve(p).catch(function(e){
    showError(e);
    throw e;
  });
}

function loginView(){
  document.getElementById('app').innerHTML=
    '<div style="min-height:85vh;display:flex;align-items:center;justify-content:center">'+
    '<div style="width:100%;max-width:400px">'+
    '<div class="hd" style="justify-content:center"><div class="lg">🔐</div><b>لوحة تحكم الياسمين — خاصة بالمالك</b></div>'+
    '<div class="card">'+
    '<div class="mut" style="margin-bottom:6px">بريد حساب المالك المسجّل في Firebase Authentication</div>'+
    '<input class="inp" id="em" type="email" autocomplete="username" placeholder="owner@email.com" style="direction:ltr"/>'+
    '<div class="mut" style="margin:8px 0 6px">كلمة المرور</div>'+
    '<input class="inp" id="pw" type="password" autocomplete="current-password" style="direction:ltr"/>'+
    '<button class="btn" id="loginBtn" style="width:100%;margin-top:12px" onclick="doLogin()">دخول</button>'+
    '<p class="mut" style="margin-top:10px">الدخول يتطلب حسابًا مُنشأً مسبقًا في Firebase. حماية البيانات يجب ضبطها أيضًا من Firestore Security Rules.</p>'+
    '</div></div></div>';
}

async function doLogin(){
  var em=document.getElementById('em').value.trim();
  var pw=document.getElementById('pw').value;

  if(!em||!pw){
    toast('اكتب البريد وكلمة المرور أولاً');
    return;
  }

  var b=document.getElementById('loginBtn');
  b.disabled=true;
  b.textContent='جارٍ الدخول…';

  try{
    await auth.signInWithEmailAndPassword(em,pw);
  }catch(e){
    alert('تعذر تسجيل الدخول: '+e.message);
  }finally{
    if(document.getElementById('loginBtn')){
      b.disabled=false;
      b.textContent='دخول';
    }
  }
}

async function render(){
  if(!S.user){
    loginView();
    return;
  }

  try{
    var d=await S.ref.get();
    S.settings=d.exists?d.data()||{}:{};
    await view();
  }catch(e){
    showError(e);
  }
}

async function view(){
  if(!S.user){
    loginView();
    return;
  }

  var tabs=[
    ['dash','📊 الرئيسية'],
    ['reqs','📋 الطلبات'],
    ['techs','🔧 الفنيون'],
    ['pays','💳 المدفوعات'],
    ['theme','🎨 المظهر والفورم'],
    ['fees','💲 الرسوم'],
    ['accs','🏦 حسابات الدفع'],
    ['comp','⚠️ الشكاوى'],
    ['more','⚙️ الإعدادات']
  ];

  var el=document.getElementById('app');

  el.innerHTML=
    '<div class="hd"><div class="lg">ي</div>'+
    '<div style="flex:1;min-width:0"><b>لوحة تحكم الياسمين</b>'+
    '<div class="mut" style="color:#9db4d8;font-size:11px">حساب الدخول: '+esc(S.user.email||'مالك')+'</div></div>'+
    '<button class="btn gh sm" onclick="signOutNow()">خروج</button></div>'+
    '<div class="tabs">'+
    tabs.map(function(t){
      return '<button class="'+(S.tab===t[0]?'on':'')+'" onclick="changeTab(\''+t[0]+'\')">'+t[1]+'</button>';
    }).join('')+
    '</div><div id="content"><div class="card center">جارٍ تحميل القسم…</div></div>';

  try{
    var body=await getTabContent();
    document.getElementById('content').innerHTML=body;
    var logs=document.getElementById('log-list');
    if(logs)loadLogs();
  }catch(e){
    document.getElementById('content').innerHTML=
      '<div class="err">تعذر تحميل القسم: '+esc(e.message)+'</div>';
  }
}

function changeTab(t){
  S.tab=t;
  view();
}

function signOutNow(){
  auth.signOut().then(function(){
    S.tab='dash';
    toast('تم تسجيل الخروج');
  }).catch(showError);
}

async function getTabContent(){
  switch(S.tab){
    case 'dash':return await vDash();
    case 'reqs':return await vReqs();
    case 'techs':return await vTechs();
    case 'pays':return await vPays();
    case 'theme':return vTheme();
    case 'fees':return vFees();
    case 'accs':return vAccs();
    case 'comp':return await vComp();
    default:return vMore();
  }
}

async function vDash(){
  var results=await Promise.all([
    db.collection('requests').get(),
    db.collection('payments').get()
  ]);

  var R=results[0].docs.map(function(d){return d.data()});
  var P=results[1].docs.map(function(d){return d.data()});
  var g=function(s){
    return R.filter(function(r){return r.status===s}).length;
  };
  var ok=P.filter(function(p){return p.status==='success'});

  return '<div class="grid">'+[
    ['الطلبات النشطة',g('open')+g('chosen')+g('accepted')+g('working')],
    ['مكتملة',g('completed')],
    ['ملغاة / مستردة',g('cancelled')+g('refunded')],
    ['إجمالي المدفوعات المؤكدة (ج.م)',ok.reduce(function(a,p){return a+(Number(p.amount)||0)},0)],
    ['بانتظار تأكيد الدفع',P.filter(function(p){return p.status==='pending'}).length],
    ['طلبات الاسترداد',P.filter(function(p){return p.status==='refund_requested'}).length]
  ].map(function(x){
    return '<div class="stat"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></div>';
  }).join('')+'</div><div class="card mut" style="margin-top:12px">الأرقام تُقرأ من مجموعتي requests وpayments في Firestore.</div>';
}

async function getDocs(col){
  var snap=await db.collection(col).get();
  return snap.docs;
}

async function listHTML(col,renderItem){
  var docs=await getDocs(col);
  docs.sort(function(a,b){
    return Number((b.data()||{}).t||0)-Number((a.data()||{}).t||0);
  });
  return docs.slice(0,100).map(function(d){
    return renderItem(d.data()||{},d.id);
  }).join('')||'<div class="item center mut">لا توجد بيانات</div>';
}

async function sect(title,col,filter,renderItem){
  var docs=await getDocs(col);
  var items=docs.filter(function(d){return filter(d.data()||{},d.id)});
  return '<div class="mut" style="font-weight:700;margin-bottom:6px">'+esc(title)+' ('+items.length+')</div>'+
    (items.length?items.map(function(d){
      return renderItem(d.data()||{},d.id);
    }).join(''):'<div class="item center mut">لا يوجد</div>');
}

async function vReqs(){
  return await listHTML('requests',function(r,id){
    var s=RST[r.status]||['—','tmut'];
    return '<div class="item"><div class="row"><div><b>'+
      esc(r.serviceId||r.service||'طلب خدمة')+
      '</b><div class="mut">'+esc(r.customerName||'')+' • '+esc(r.customerPhone||'')+
      '</div><div class="mut">'+esc(r.car||'')+' • '+esc(r.loc||r.location||'')+' • '+esc(r.desc||'')+
      '</div><div class="mut">رقم الطلب: '+esc(id)+'</div></div>'+
      '<span class="tag '+s[1]+'">'+s[0]+'</span></div>'+
      (['open','chosen'].indexOf(r.status)>-1?
      '<button class="btn bad sm" style="margin-top:6px" onclick="cancelRequest(\''+id+'\')">إلغاء إداري</button>':'')+
      '</div>';
  });
}

async function cancelRequest(id){
  if(!confirm('تأكيد إلغاء الطلب؟'))return;
  try{
    await db.collection('requests').doc(id).update({status:'cancelled'});
    await log('إلغاء إداري للطلب '+id);
    toast('تم إلغاء الطلب');
    await view();
  }catch(e){
    showError(e);
  }
}

async function vTechs(){
  var pending=await sect('بانتظار الاعتماد','technicians',function(t){
    return !t.approved&&t.pending;
  },function(t,id){
    return '<div class="item"><b>'+esc(t.name||'فني')+'</b><div class="mut">'+esc(t.phone||'')+' • '+esc(t.area||'')+
      '</div><div class="mut">'+esc((t.specs||[]).join('، '))+
      '</div><div class="row" style="margin-top:6px">'+
      '<button class="btn ok sm" onclick="updateTech(\''+id+'\',{approved:true,pending:false},\'اعتماد الفني\')">✅ اعتماد</button>'+
      '<button class="btn bad sm" onclick="updateTech(\''+id+'\',{rejected:true,pending:false},\'رفض الفني\')">❌ رفض</button></div></div>';
  });

  var approved=await sect('فنيون معتمدون','technicians',function(t){
    return !!t.approved;
  },function(t,id){
    return '<div class="item"><div class="row"><div><b>'+esc(t.name||'فني')+
      '</b><div class="mut">★ '+esc(t.rating||0)+' • '+esc(t.jobs||0)+' خدمة • '+esc(t.area||'')+
      '</div></div><span class="tag '+(t.blocked?'tbad':'tok')+'">'+(t.blocked?'موقوف':'نشط')+
      '</span></div><button class="btn gh sm" style="margin-top:6px" onclick="updateTech(\''+id+'\',{blocked:'+(!t.blocked)+'},\'تغيير حالة الفني\')">'+
      (t.blocked?'إلغاء الإيقاف':'إيقاف الحساب')+'</button></div>';
  });

  return pending+approved;
}

async function updateTech(id,patch,label){
  try{
    await db.collection('technicians').doc(id).update(patch);
    await log(label+' '+id);
    toast('تم تحديث بيانات الفني');
    await view();
  }catch(e){
    showError(e);
  }
}

async function vPays(){
  return await listHTML('payments',function(p,id){
    var s=STS[p.status]||['—','tmut'];
    var receipt=p.receiptUrl?
      (/^data:image/i.test(p.receiptUrl)?
        '<img alt="إيصال الدفع" src="'+esc(p.receiptUrl)+'" style="max-width:100%;border-radius:8px;margin-top:6px">':
        '<a href="'+esc(p.receiptUrl)+'" target="_blank" rel="noopener">🧾 عرض الإيصال</a>'):'';

    return '<div class="item"><div class="row"><div><b>'+esc(p.amount||0)+' ج.م</b> '+
      '<span class="tag '+(p.party==='customer'?'tinfo':'twarn')+'">'+
      (p.party==='customer'?'رسوم عميل':'رسوم فني')+'</span>'+
      '<div class="mut">'+esc(p.tx||'')+'</div>'+receipt+
      '<div class="mut">رقم العملية: '+esc(id)+'</div></div>'+
      '<span class="tag '+s[1]+'">'+s[0]+'</span></div>'+
      (p.status==='pending'?
        '<div class="row" style="margin-top:6px"><button class="btn ok sm" onclick="confirmPay(\''+id+'\',\''+(p.reqId||'')+'\',\''+(p.party||'')+'\')">✅ تأكيد الاستلام</button>'+
        '<button class="btn gh sm" onclick="rejectPay(\''+id+'\',\''+(p.reqId||'')+'\')">الإيصال غير صحيح</button></div>':'')+
      (p.status==='success'?
        '<button class="btn gh sm" style="margin-top:6px" onclick="doRefund(\''+id+'\',\''+(p.reqId||'')+'\')">↩️ تسجيل الاسترداد</button>':'')+
      (p.status==='refund_requested'?
        '<div class="row" style="margin-top:6px"><button class="btn ok sm" onclick="doRefund(\''+id+'\',\''+(p.reqId||'')+'\')">تسجيل تنفيذ الاسترداد</button>'+
        '<button class="btn gh sm" onclick="setPayStatus(\''+id+'\',\'success\')">رفض الطلب</button></div>':'')+
      '</div>';
  });
}

async function confirmPay(pid,reqId,party){
  if(!confirm('تأكيد استلام الرسوم بعد مراجعة التحويل فعليًا؟'))return;
  try{
    await db.collection('payments').doc(pid).update({status:'success'});
    if(reqId){
      var r=await db.collection('requests').doc(reqId).get();
      var st=r.exists?(r.data()||{}).status:'';
      if(party==='customer'&&st==='awaiting_payment')
        await db.collection('requests').doc(reqId).update({status:'open'});
      if(party==='tech'&&st==='awaiting_tech_payment')
        await db.collection('requests').doc(reqId).update({status:'accepted'});
    }
    await log('تأكيد عملية '+pid);
    toast('تم تحديث حالة الدفع');
    await view();
  }catch(e){
    showError(e);
  }
}

async function rejectPay(pid,reqId){
  if(!confirm('تأكيد رفض الإيصال؟'))return;
  try{
    await db.collection('payments').doc(pid).update({status:'failed'});
    if(reqId)await db.collection('requests').doc(reqId).update({status:'cancelled'});
    await log('رفض عملية '+pid);
    toast('تم رفض الإيصال');
    await view();
  }catch(e){
    showError(e);
  }
}

async function setPayStatus(pid,status){
  try{
    await db.collection('payments').doc(pid).update({status:status});
    await log('تغيير حالة الدفع '+pid+' إلى '+status);
    toast('تم تحديث حالة الدفع');
    await view();
  }catch(e){
    showError(e);
  }
}

async function doRefund(pid,reqId){
  if(!confirm('سجّل العملية كمستردة؟ هذا لا يحوّل الأموال تلقائيًا.'))return;
  try{
    var ref=db.collection('payments').doc(pid);
    var d=await ref.get();

    if(!d.exists){
      toast('عملية الدفع غير موجودة');
      return;
    }

    if((d.data()||{}).status==='refunded'){
      toast('العملية مسجلة كمستردة مسبقًا');
      return;
    }

    await ref.update({status:'refunded'});

    if(reqId){
      var r=await db.collection('requests').doc(reqId).get();
      if(r.exists&&['awaiting_payment','open','chosen','cancelled'].indexOf((r.data()||{}).status)>-1)
        await db.collection('requests').doc(reqId).update({status:'refunded'});
    }

    await log('تسجيل استرداد '+pid);
    toast('تم تسجيل الحالة. يجب تنفيذ التحويل فعليًا من مزود الدفع');
    await view();
  }catch(e){
    showError(e);
  }
}

function vTheme(){
  var s=S.settings||{};

  function colorRow(k,label){
    var val=Number(s[k]);
    return '<div class="colorrow"><input type="color" id="c-'+k+'" value="'+
      (Number.isFinite(val)&&val>0?'#'+val.toString(16).padStart(6,'0').slice(-6):'#0d1f3c')+
      '"><b>'+label+'</b></div>';
  }

  function sw(k,label){
    return '<div class="swrow"><span>'+label+'</span><div role="switch" aria-label="'+label+
      '" class="sw '+(s.formConfig&&s.formConfig[k]!==false?'on':'')+
      '" onclick="toggleForm(\''+k+'\',this)"></div></div>';
  }

  return '<div class="card"><b>🎨 هوية التطبيق</b><div style="margin-top:8px"><div class="mut">اسم المنصة</div>'+
    '<input class="inp" id="t-name" value="'+esc(s.appName||'الياسمين')+'"></div>'+
    colorRow('primaryColor','اللون الأساسي')+
    colorRow('accentColor','اللون الثانوي')+
    colorRow('emergencyColor','لون الطوارئ')+
    '<button class="btn ok" style="width:100%;margin-top:6px" onclick="saveTheme()">💾 حفظ</button></div>'+
    '<div class="card"><b>📝 حقول نموذج الطلب</b>'+
    sw('photos','إرفاق صور')+sw('desc','وصف المشكلة')+sw('carYear','سنة الصنع')+
    sw('plate','رقم اللوحة')+sw('notes','ملاحظات إضافية')+
    '<div class="mut" style="margin-top:6px">قد يحتاج تطبيق الهاتف إلى قراءة هذه الإعدادات حتى يظهر التغيير فيه.</div></div>'+
    '<div class="card"><b>🧰 الخدمات</b>'+
    Object.keys(s.services||{}).map(function(k){
      return '<div class="swrow"><span>'+esc(k)+'</span><div role="switch" aria-label="'+esc(k)+
        '" class="sw '+(s.services[k]?'on':'')+
        '" onclick="toggleService(\''+k.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\',this)"></div></div>';
    }).join('')+
    '<div class="row" style="margin-top:8px"><input class="inp" id="new-svc" placeholder="خدمة جديدة">'+
    '<button class="btn gh sm" style="flex:0 0 auto" onclick="addSvc()">+ إضافة</button></div></div>';
}

async function toggleForm(k,el){
  try{
    var f=Object.assign({},S.settings.formConfig||{});
    f[k]=f[k]===false;
    await S.ref.update({formConfig:f});
    S.settings.formConfig=f;
    el.classList.toggle('on',f[k]!==false);
    await log('تعديل نموذج: '+k);
    toast('تم الحفظ');
  }catch(e){
    showError(e);
  }
}

async function toggleService(k,el){
  try{
    var sv=Object.assign({},S.settings.services||{});
    sv[k]=!sv[k];
    await S.ref.update({services:sv});
    S.settings.services=sv;
    el.classList.toggle('on',!!sv[k]);
    await log((sv[k]?'تفعيل':'إيقاف')+' خدمة: '+k);
    toast('تم حفظ الخدمة');
  }catch(e){
    showError(e);
  }
}

async function saveTheme(){
  try{
    await S.ref.set({
      appName:document.getElementById('t-name').value.trim(),
      primaryColor:parseInt(document.getElementById('c-primaryColor').value.slice(1),16),
      accentColor:parseInt(document.getElementById('c-accentColor').value.slice(1),16),
      emergencyColor:parseInt(document.getElementById('c-emergencyColor').value.slice(1),16)
    },{merge:true});
    await log('تعديل الهوية والألوان');
    toast('تم حفظ الهوية والألوان');
    await render();
  }catch(e){
    showError(e);
  }
}

async function addSvc(){
  var input=document.getElementById('new-svc');
  var v=input.value.trim();
  if(!v)return;

  try{
    var sv=Object.assign({},S.settings.services||{});
    sv[v]=true;
    await S.ref.update({services:sv});
    S.settings.services=sv;
    await log('إضافة خدمة: '+v);
    toast('تمت إضافة الخدمة');
    await view();
  }catch(e){
    showError(e);
  }
}

function vFees(){
  var s=S.settings||{};
  return '<div class="card"><b>💲 رسوم المنصة (ج.م)</b>'+
    '<div class="row" style="margin:10px 0"><label for="f-c" class="mut">رسوم العميل</label>'+
    '<input class="inp" id="f-c" type="number" min="0" step="1" value="'+Number(s.customerFee==null?30:s.customerFee)+'"></div>'+
    '<div class="row" style="margin:10px 0"><label for="f-t" class="mut">رسوم الفني</label>'+
    '<input class="inp" id="f-t" type="number" min="0" step="1" value="'+Number(s.techFee==null?25:s.techFee)+'"></div>'+
    '<button class="btn ok" style="width:100%" onclick="saveFees()">💾 حفظ الرسوم</button>'+
    '<div class="mut" style="margin-top:8px">هذه القيم إعدادات لوحة التحكم؛ تأكد أن التطبيق يقرأها ويحسب الرسوم وفق قواعده.</div></div>';
}

async function saveFees(){
  var c=Number(document.getElementById('f-c').value);
  var t=Number(document.getElementById('f-t').value);

  if(!Number.isFinite(c)||!Number.isFinite(t)||c<0||t<0){
    toast('أدخل رسومًا صحيحة غير سالبة');
    return;
  }

  try{
    await S.ref.update({customerFee:c,techFee:t});
    await log('تعديل الرسوم');
    toast('تم حفظ الرسوم');
    await render();
  }catch(e){
    showError(e);
  }
}

function vAccs(){
  var acc=(S.settings||{}).paymentAccounts||[];
  return '<div class="card"><b>🏦 حسابات استلام الرسوم</b>'+
    acc.map(function(a,i){
      return '<div class="item"><div class="row"><div><b>'+esc(a.type)+
        '</b><div class="mut" style="direction:ltr;text-align:right">'+esc(a.value)+
        '</div></div><button class="btn bad sm" style="flex:0 0 auto" onclick="delAcc('+i+')">حذف</button></div></div>';
    }).join('')+
    '<div class="row" style="margin-top:6px"><select class="inp" id="na-t" style="max-width:140px">'+
    '<option>انستاباي</option><option>فودافون كاش</option><option>اتصالات كاش</option><option>أورانج كاش</option><option>حساب بنكي IBAN</option></select>'+
    '<input class="inp" id="na-v" placeholder="الرقم أو الحساب" style="direction:ltr">'+
    '<button class="btn gh sm" style="flex:0 0 auto" onclick="addAcc()">+ إضافة</button></div></div>';
}

async function addAcc(){
  var v=document.getElementById('na-v').value.trim();
  if(!v){
    toast('اكتب بيانات الحساب');
    return;
  }

  try{
    var acc=(S.settings.paymentAccounts||[]).slice();
    acc.push({type:document.getElementById('na-t').value,value:v});
    await S.ref.update({paymentAccounts:acc});
    S.settings.paymentAccounts=acc;
    await log('إضافة حساب دفع');
    toast('تمت إضافة الحساب');
    await view();
  }catch(e){
    showError(e);
  }
}

async function delAcc(i){
  var acc=(S.settings.paymentAccounts||[]).slice();

  if(acc.length<=1){
    toast('يجب الإبقاء على حساب واحد على الأقل');
    return;
  }

  if(!confirm('تأكيد حذف حساب الدفع؟'))return;

  acc.splice(i,1);

  try{
    await S.ref.update({paymentAccounts:acc});
    S.settings.paymentAccounts=acc;
    await log('حذف حساب دفع');
    toast('تم حذف الحساب');
    await view();
  }catch(e){
    showError(e);
  }
}

async function vComp(){
  return await listHTML('complaints',function(c,id){
    return '<div class="item"><div class="row"><b>'+esc(c.by||'مستخدم')+
      '</b><span class="tag '+(c.status==='open'?'tbad':'tok')+'">'+
      (c.status==='open'?'مفتوحة':'تمت المعالجة')+'</span></div>'+
      '<div class="mut">'+esc(c.text||'')+'</div>'+
      (c.status==='open'?'<button class="btn ok sm" style="margin-top:6px" onclick="resolveComplaint(\''+id+'\')">تحديد كمعالجة</button>':'')+
      '</div>';
  });
}

async function resolveComplaint(id){
  try{
    await db.collection('complaints').doc(id).update({status:'resolved'});
    await log('معالجة الشكوى '+id);
    toast('تم تحديث الشكوى');
    await view();
  }catch(e){
    showError(e);
  }
}

var DEFAULT_SERVICES={
  'الكاوتش والإطارات':true,
  'البطاريات وكهرباء السيارات':true,
  'الميكانيكا والمحرك':true,
  'التبريد والسخونة':true,
  'الفرامل والعفشة والتوجيه':true,
  'تشخيص الكمبيوتر والحساسات':true,
  'تكييف السيارات':true,
  'الونش والسحب والإنقاذ':true,
  'قطع الغيار والمستلزمات':true,
  'خدمات المفاتيح':true,
  'السيارات الهجينة والكهربائية':true
};

async function seedPlatform(){
  if(!confirm('تهيئة الإعدادات الافتراضية؟ لن تُستبدل الحقول الأخرى.'))return;

  try{
    await S.ref.set({
      appName:'الياسمين لإصلاح أعطال السيارات في الطرق والصحراء',
      primaryColor:0x0d1f3c,
      accentColor:0x4da3ff,
      emergencyColor:0xe23d3d,
      logoUrl:'',
      ownerPhone:'',
      customerFee:30,
      techFee:25,
      paymentAccounts:[],
      formConfig:{photos:true,desc:true,carYear:false,plate:false,notes:false},
      services:DEFAULT_SERVICES
    },{merge:true});

    await log('تهيئة المنصة');
    toast('تمت التهيئة. أضف حسابات الدفع الحقيقية من قسم حسابات الدفع.');
    await render();
  }catch(e){
    showError(e);
  }
}

function vMore(){
  var s=S.settings||{};
  return '<div class="card"><b>🚀 تهيئة أول مرة</b>'+
    '<div class="mut" style="margin:6px 0">تضيف إعدادات الخدمات والألوان والرسوم الافتراضية مع الإبقاء على الإعدادات الأخرى.</div>'+
    '<button class="btn ok" style="width:100%" onclick="seedPlatform()">تهيئة الإعدادات</button></div>'+
    '<div class="card"><b>⚙️ إعدادات التواصل</b>'+
    '<div class="mut" style="margin:8px 0 4px">رقم تواصل المالك</div>'+
    '<input class="inp" id="m-phone" value="'+esc(s.ownerPhone||'')+'" style="direction:ltr;text-align:right">'+
    '<button class="btn ok" style="width:100%;margin-top:8px" onclick="saveOwnerSettings()">💾 حفظ</button></div>'+
    '<div class="card"><b>📜 سجل العمليات الأخيرة</b><div id="log-list" class="mut">جارٍ التحميل…</div></div>';
}

async function saveOwnerSettings(){
  try{
    await S.ref.set({
      ownerPhone:document.getElementById('m-phone').value.trim()
    },{merge:true});
    await log('تعديل إعدادات التواصل');
    toast('تم الحفظ');
    await render();
  }catch(e){
    showError(e);
  }
}

async function loadLogs(){
  var el=document.getElementById('log-list');
  if(!el)return;

  try{
    var docs=await getDocs('logs');
    docs.sort(function(a,b){
      return Number((b.data()||{}).t||0)-Number((a.data()||{}).t||0);
    });

    el.innerHTML=docs.slice(0,20).map(function(d){
      var x=d.data()||{};
      return '<div class="item"><div>'+esc(x.msg||'عملية')+
        '</div><div class="mut">'+(x.t?esc(new Date(x.t).toLocaleString('ar-EG')):'')+'</div></div>';
    }).join('')||'لا توجد عمليات مسجلة';
  }catch(e){
    el.textContent='تعذر تحميل السجل: '+e.message;
  }
}

try{
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.firestore();
  S.ref=db.collection('settings').doc('app');

  auth.onAuthStateChanged(function(u){
    S.user=u||null;
    render();
  });
}catch(e){
  showError(e);
  document.getElementById('app').innerHTML=
    '<div class="err">تعذر تشغيل Firebase. تحقق من تحميل المكتبات وإعدادات المشروع.</div>';
}
</script>
</body>
</html>
