publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
